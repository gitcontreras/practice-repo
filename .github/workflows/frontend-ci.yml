name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/my-app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/my-app/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-lint:
    name: Build and lint Next.js app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/my-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/my-app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build
