name: Frontend PR review

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/my-app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - 'frontend/my-app/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build, test and lint Next.js app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/my-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/my-app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build

  claude-review:
    name: Claude PR reviewer
    needs: build-and-lint
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
                
      - name: Review PR with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-3-5-sonnet-20241022  # Add this line with a valid model
          direct_prompt: |
            Review this React/Next.js PR with a focus on code quality, maintainability, and practical engineering risks.

            Prioritize high-confidence findings and avoid trivial style-only comments.
            Focus on:
            - incorrect hook usage or missing dependencies
            - unnecessary state, unnecessary re-renders, and misuse of useEffect
            - React performance issues in components
            - rendering or hydration problems in the Next.js App Router
            - incorrect loading/error and async data handling
            - basic accessibility issues in forms and buttons
            - props, keys, memoization, and component composition issues
            - security concerns and unsafe handling of user input
            - server/client component patterns in Next.js

            Respond in English and provide feedback in this format:
            - severity: high|medium|low
            - file: file path
            - issue: brief problem description
            - why: why this is a problem
            - fix: concrete recommendation for the fix

            If you do not find any clear issues, respond exactly:
            No high-confidence issues found in this PR.
